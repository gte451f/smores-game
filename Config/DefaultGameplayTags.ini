; The project's gameplay-tag vocabulary. A tag on a definition (USmoresDefinition::Tags) says what
; kind of thing it is; a loot table's "Any Item With Tag" entry picks among every item carrying one.
; Add a tag here only when something reads it - a tag nothing consumes is dead data.
[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
+GameplayTagList=(Tag="Item.Mineral",DevComment="Raw minerals - ore, salt, sulfur. DA_Loot_DesertMinerals picks among these by tag.")
